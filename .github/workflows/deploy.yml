name: 🚀 Deploy Express Application to CloudPanel

on:
  push:
    branches:
      - main  # Triggers deployment whenever code is pushed to the main branch -tmp

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Latest Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: 📂 Sync Files via Rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc --delete" # Clean sync: removes deleted repository files from server
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: "22"
          SOURCE: "./" # Sync entire project folder
          TARGET: "/home/${{ secrets.SERVER_USER }}/htdocs/emailmarketing.ratehonk.com/" # Path to your site folder
          EXCLUDE: "/node_modules/, /.git/, /.github/, .env, /dist/, /uploads/" # Do not sync local dependency folders

      - name: 🖼️ Sync Uploads folder (No delete)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc" # No delete, so server images remain
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: "22"
          SOURCE: "./public/uploads/"
          TARGET: "/home/${{ secrets.SERVER_USER }}/htdocs/emailmarketing.ratehonk.com/public/uploads/"

      - name: 🔄 Install Dependencies & Restart App
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |

            # 🛑 CRUCIAL: Exit immediately if any command exits with a non-zero status
            set -e
            cd /home/${{ secrets.SERVER_USER }}/htdocs/emailmarketing.ratehonk.com/

            if [ ! -f .env ]; then
              echo "⚠️ WARNING: .env file is missing on the server!"
              echo "Creating a baseline .env file with default port to prevent crash..."
              echo "PORT=5005" > .env
              echo "NODE_ENV=production" >> .env
              echo "👉 Action required: SSH into the server and fill in your database/API keys manually!"
            else
              echo "✅ .env file detected successfully."
            fi

            if ! command -v pm2 &> /dev/null; then
              echo "⚠️ PM2 not found. Installing globally..."
              npm install pm2@latest -g
            else
              echo "✅ PM2 is already installed. Skipping installation."
            fi
            # ---- Install Redis if missing ----
            if ! command -v redis-server &> /dev/null; then
              echo "⚠️ Redis not found. Installing..."
              sudo apt-get update -y && sudo apt-get install -y redis-server
              sudo systemctl enable --now redis-server
            else
              echo "✅ Redis is already installed."
            fi

            # ---- Ensure Node 24 is installed (nvm – no sudo) ----
            if ! command -v node &> /dev/null || [ "$(node -v | cut -d. -f1 | tr -d 'v')" -lt 24 ]; then
              echo "⚠️ Node 24 not found. Installing via nvm..."
              # Install nvm if it isn’t already present
              if [ ! -d "$HOME/.nvm" ]; then
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
              fi
              # Load nvm into the shell session
              export NVM_DIR="$HOME/.nvm"
              # shellcheck disable=SC1090
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              # Install and use Node 24
              nvm install 24
              nvm use 24
            else
              echo "✅ Node 24 is already installed."
            fi

            # ---- Production dependencies ----
            npm install --legacy-peer-deps --force

            npm run build
            # Compile server TypeScript to dist
            npx tsc --project tsconfig.server.json
            rm -rf ./app
            npm ci --only=production
            
            # Ensure PM2 starts in production mode to serve static files correctly
            export NODE_ENV=production
            pm2 restart index --update-env || pm2 start dist/index.js --name "index"
            pm2 start npm --name "next" -- start
            pm2 save

